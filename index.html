<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Around the U.S.</title>
    <meta name="description" content="Galeria" />
    <meta name="keywords" content="HTML, CSS, JavaScript" />
    <meta name="author" content="Fernanda Ruíz" />
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="icon" href="./favicon.ico" />
  </head>

  <body>
    <div class="page">
      <header class="header">
        <div class="header__content">
          <nav class="header__nav">
            <img
              src="./images/logo.svg"
              alt="Logotipo de Around the U.S."
              class="header__logo"
            />
          </nav>
        </div>
        <div class="header__line"></div>
      </header>

      <main class="content">
        <section class="profile" id="profile">
          <div class="profile__col profile__co--avatar">
            <img
              class="profile__img"
              alt="image avatar"
              src="./images/Avatar.png"
            />
          </div>

          <div class="profile__col profile__col--name">
            <div class="profile__text">
              <h1 id="profileName"></h1>
              <p id="profileDescription"></p>
            </div>
            <div class="profile__edit">
              <button class="profile__edit-button" id="openEditModal">
                <img
                  class="profile__edit-img"
                  alt="edit button"
                  src="./images/Edit Button.svg"
                />
              </button>
            </div>
          </div>

          <div class="profile profile__col--add">
            <button class="profile__add-button" id="openAddModal">
              <img
                class="profile__button-img"
                alt="add button"
                src="./images/plus.svg"
              />
            </button>
          </div>

          <div class="profile__edit-modal modal" id="editModal">
            <div class="modal-content">
              <span class="close">&times;</span>

              <h2>Editar perfil</h2>
              <form id="editForm">
                <!-- <label for="name">Nombre:</label> -->
                <input
                  placeholder="Name"
                  type="text"
                  id="name"
                  name="name"
                  required
                />
                <!-- <label for="aboutMe">Acerca de mí:</label> -->
                <input
                  placeholder="Acerca de mí"
                  id="aboutMe"
                  name="aboutMe"
                  required
                />
                <button id="buttonEdit" disabled type="submit">Guardar</button>
              </form>
            </div>
          </div>
        </section>

        <section class="elements" id="elements">
          
        </section>

        <div class="add-modal modal" id="addModal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Nuevo lugar</h2>
            <form id="addCardForm">
              <!-- <label for="title">Título:</label> -->
              <input
                placeholder="Título"
                type="text"
                id="title"
                name="title"
                required
              />
              <!-- <label for="placeimage">Imagen</label> -->
              <input
                placeholder="Enlace a la imagen"
                type="text"
                id="placeimage"
                name="placeimage"
                required
              />
              <button id="buttonAdd" disabled type="submit">Crear</button>
            </form>
          </div>
        </div>

        <div id="lightbox" class="lightbox">
          <div class="lightbox__content-wrapper">
            <span class="lightbox__close">&times;</span>
            <img class="lightbox__content" id="lightboxImage" />
          </div>
        </div>
      </main>

      <footer class="footer" id="footer">
        <p class="footer__copyright">© 2021 Around The U.S.</p>
      </footer>
    </div>

    <script src="index.js"></script>
  </body>
</html>
